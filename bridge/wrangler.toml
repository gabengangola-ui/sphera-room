name = "sphera-bridge"
main = "worker.js"
compatibility_date = "2024-01-01"

# Durable Object — owns the canonical event ledger
# Atomically assigns sequence numbers and persists events in one transaction
[[durable_objects.bindings]]
name       = "LEDGER"
class_name = "EventLedger"

[[migrations]]
tag         = "v1"
new_classes = ["EventLedger"]

# Note: KV is no longer needed for the event log.
# If you created an EVENTS KV namespace for v0.0.3, it can be removed.

# Secrets — set via Cloudflare dashboard or CLI only, never in chat:
#   wrangler secret put GITHUB_TOKEN   # fine-grained PAT: sphera-room, contents read+write
#   wrangler secret put CLAUDE_KEY
#   wrangler secret put SOBA_KEY
#   wrangler secret put ARCHIVES_KEY
