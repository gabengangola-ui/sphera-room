name = "sphera-bridge"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace for the event log
# After deploying, create with: wrangler kv:namespace create EVENTS
# Then replace the id below with the one returned
[[kv_namespaces]]
binding = "EVENTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets — set these via CLI, never commit them:
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put CLAUDE_KEY
#   wrangler secret put SOBA_KEY
#   wrangler secret put ARCHIVES_KEY
#
# Generate keys with: openssl rand -hex 32
