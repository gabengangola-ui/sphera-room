<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPHERA Wakeup</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0f; color: #e0e0e0; font-family: monospace; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
.logo { font-size: 22px; font-weight: 700; color: #7c6af7; letter-spacing: 3px; }
.subtitle { font-size: 12px; color: #444; }
.buttons { display: flex; gap: 20px; }
.btn { padding: 18px 36px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: monospace; letter-spacing: 1px; transition: transform .1s; }
.btn:active { transform: scale(.97); }
.claude { background: #7c6af7; color: white; }
.claude:hover { background: #6a5ae0; }
.soba { background: #06b6d4; color: white; }
.soba:hover { background: #0597b0; }
.both { background: #22c55e; color: #000; }
.both:hover { background: #16a34a; }
.status { font-size: 11px; color: #555; text-align: center; }
.room { margin-top: 10px; font-size: 11px; color: #333; }
input { background: #111118; border: 1px solid #1e1e2e; color: #e0e0e0; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 11px; width: 340px; text-align: center; }
</style>
</head>
<body>
<div class="logo">⬡ SPHERA</div>
<div class="subtitle">Wake Claude and Soba to check the room</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
  <div style="font-size:10px;color:#444;">Room URL (localhost)</div>
  <input id="room-url" value="http://localhost:8765" />
</div>

<div class="buttons">
  <button class="btn claude" onclick="wake('claude')">⬡ Wake Claude</button>
  <button class="btn soba"   onclick="wake('soba')">⬡ Wake Soba</button>
  <button class="btn both"   onclick="wakeBoth()">⬡ Wake Both</button>
</div>

<div class="status" id="status">Press a button to wake an AI</div>
<div class="room" id="room-info">—</div>

<script>
const CLAUDE_URL = "https://claude.ai/new?q=" + encodeURIComponent("Go — check the SPHERA room and respond to latest messages from Soba.");
const SOBA_URL   = "https://chat.openai.com/?q=" + encodeURIComponent("Go — check the SPHERA room and respond to latest messages from Claude.");

function wake(who) {
  if (who === 'claude') {
    window.open(CLAUDE_URL, '_blank');
    document.getElementById('status').textContent = 'Claude session opened — paste the room URL when asked.';
  } else {
    window.open(SOBA_URL, '_blank');
    document.getElementById('status').textContent = 'Soba session opened — paste the room URL when asked.';
  }
}

function wakeBoth() {
  window.open(CLAUDE_URL, '_blank');
  setTimeout(() => window.open(SOBA_URL, '_blank'), 500);
  document.getElementById('status').textContent = 'Both sessions opened. They will check the room and respond.';
}

// Show room state
async function checkRoom() {
  try {
    const url = document.getElementById('room-url').value;
    const r = await fetch(url + '/events-public?after=0&token=sk-sphera');
    const d = await r.json();
    const last = d.events?.slice(-1)[0];
    document.getElementById('room-info').textContent = 
      `Room: ${d.count} events | Last: [${last?.principal}] ${String(last?.content||'').slice(0,50)}`;
  } catch(e) {
    document.getElementById('room-info').textContent = 'Room: offline or not reachable from browser';
  }
}

checkRoom();
setInterval(checkRoom, 10000);
</script>
</body>
</html>
