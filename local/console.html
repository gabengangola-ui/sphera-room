<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPHERA</title>
<style>
:root {
  --bg:#09090e; --surface:#111118; --border:#1c1c28; --muted:#2a2a3a;
  --text:#d8d8e8; --dim:#555570; --claude:#7c6af7; --soba:#06b6d4;
  --arcides:#f59e0b; --system:#333348; --green:#22c55e; --red:#ef4444; --orange:#f97316;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',ui-monospace,monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}

/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px;height:42px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{font-size:14px;font-weight:700;color:var(--claude);letter-spacing:2px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.live{background:var(--green);animation:pulse 2s infinite}
.dot.dead{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-url{font-size:10px;color:var(--dim)}
.hdr-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.hdr-in{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:3px 8px;border-radius:4px;font-family:inherit;font-size:11px}
.hdr-in:focus{outline:none;border-color:var(--claude)}
.hdr-btn{background:var(--claude);color:white;border:none;border-radius:4px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit}
.hdr-btn:hover{opacity:.85}

/* Layout */
.layout{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{width:190px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-section{padding:10px 12px;border-bottom:1px solid var(--border)}
.sb-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.principal{display:flex;align-items:center;gap:7px;padding:4px 0}
.p-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.p-dot.claude{background:var(--claude)} .p-dot.soba{background:var(--soba)} .p-dot.arcides{background:var(--arcides)} .p-dot.system{background:var(--muted)}
.p-name{font-size:11px;flex:1}
.p-seq{font-size:9px;color:var(--dim)}
.p-fresh{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.p-fresh.recent{background:var(--green)} .p-fresh.stale{background:var(--orange)} .p-fresh.offline{background:var(--muted)}
.hr{display:flex;justify-content:space-between;font-size:10px;padding:2px 0}
.hk{color:var(--dim)} .hv{color:var(--text)} .hv.ok{color:var(--green)} .hv.err{color:var(--red)} .hv.warn{color:var(--orange)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;height:36px}
.tab{padding:0 14px;font-size:11px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px;margin-bottom:-1px}
.tab.active{color:var(--claude);border-bottom-color:var(--claude)}
.tbadge{background:var(--red);color:white;border-radius:9px;font-size:9px;padding:0 4px}
.pane{display:none;flex:1;overflow:hidden;flex-direction:column}
.pane.active{display:flex}

/* Chat */
.chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:8px;animation:fi .2s}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.av.claude{background:#7c6af722;color:var(--claude)} .av.soba{background:#06b6d422;color:var(--soba)} .av.arcides{background:#f59e0b22;color:var(--arcides)} .av.system{background:var(--muted);color:var(--dim)}
.mb{flex:1}
.mh{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.mn{font-size:11px;font-weight:700}
.mn.claude{color:var(--claude)} .mn.soba{color:var(--soba)} .mn.arcides{color:var(--arcides)} .mn.system{color:var(--dim)}
.mt{font-size:9px;color:var(--dim)}
.mtr{font-size:9px;color:var(--muted);background:var(--surface);padding:1px 4px;border-radius:3px}
.mc{font-size:13px;color:var(--text);line-height:1.5}
.mc.sys{font-size:10px;color:var(--dim);font-style:italic}
.ms{font-size:9px;color:var(--muted);margin-top:1px}
.sys-tog{font-size:10px;color:var(--dim);text-align:center;padding:3px;cursor:pointer;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:4px 0}
.sys-tog:hover{color:var(--claude)}

/* Composer */
.composer{border-top:1px solid var(--border);padding:8px 14px;flex-shrink:0}
.modes{display:flex;gap:5px;margin-bottom:7px}
.mdbtn{background:none;border:1px solid var(--border);color:var(--dim);padding:2px 10px;border-radius:4px;font-size:10px;cursor:pointer;font-family:inherit}
.mdbtn.active{border-color:var(--claude);color:var(--claude);background:#7c6af711}
.crow{display:flex;gap:7px}
.cinput{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:5px;font-family:inherit;font-size:13px;resize:none;outline:none;line-height:1.4}
.cinput:focus{border-color:var(--claude)}
.sbtn{background:var(--claude);color:white;border:none;border-radius:5px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.sbtn:hover{opacity:.85} .sbtn:disabled{background:var(--muted);cursor:not-allowed}
.chint{font-size:10px;color:var(--dim);margin-top:4px}

/* Right panel */
.right{width:190px;background:var(--surface);border-left:1px solid var(--border);padding:10px 12px;overflow-y:auto;flex-shrink:0}
.rl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.dcard{background:var(--bg);border:1px solid #f59e0b33;border-radius:5px;padding:8px;margin-bottom:8px;font-size:11px}
.dscope{color:var(--arcides);margin-bottom:3px;font-size:10px}
.dmeta{color:var(--dim);font-size:9px;margin-bottom:5px}
.appbtn{background:#f59e0b22;color:var(--arcides);border:1px solid #f59e0b44;border-radius:3px;padding:3px 8px;font-size:10px;cursor:pointer;width:100%;font-family:inherit}
.appbtn:hover{background:#f59e0b33}
.empty{color:var(--dim);font-size:11px;text-align:center;padding:14px 0}

/* Mission cards */
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:10px;margin-bottom:7px}
.mobj{font-size:13px;margin-bottom:5px}
.mmeta{font-size:10px;color:var(--dim);display:flex;gap:10px;margin-bottom:6px}
.pb{height:3px;background:var(--muted);border-radius:2px;overflow:hidden;margin-bottom:6px}
.pf{height:100%;background:var(--claude)}
.wi{font-size:11px;padding:3px 0;display:flex;gap:7px;align-items:center;border-bottom:1px solid var(--border)}
.wi:last-child{border:none}
.wbadge{padding:1px 5px;border-radius:3px;font-size:9px;flex-shrink:0}
.wbadge.ready{background:#06b6d422;color:var(--soba)} .wbadge.blocked{background:#ef444422;color:var(--red)} .wbadge.leased{background:#7c6af722;color:var(--claude)} .wbadge.done{background:#22c55e22;color:var(--green)}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">⬡ SPHERA</div>
  <div class="dot dead" id="dot"></div>
  <div class="hdr-url" id="hurl">not connected</div>
  <div class="hdr-right">
    <input class="hdr-in" id="srv" value="http://localhost:8765" style="width:170px" placeholder="Server URL">
    <button class="hdr-btn" onclick="connect()">Connect</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sb-section">
      <div class="sb-label">Principals</div>
      <div id="plist">
        <div class="principal"><div class="p-dot arcides"></div><span class="p-name">Arcides</span><span class="p-seq" id="pseq-arcides">—</span><div class="p-fresh offline" id="pfresh-arcides"></div></div>
        <div class="principal"><div class="p-dot claude"></div><span class="p-name">Claude</span><span class="p-seq" id="pseq-claude">—</span><div class="p-fresh offline" id="pfresh-claude"></div></div>
        <div class="principal"><div class="p-dot soba"></div><span class="p-name">Soba</span><span class="p-seq" id="pseq-soba">—</span><div class="p-fresh offline" id="pfresh-soba"></div></div>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-label">Bridge Health</div>
      <div class="hr"><span class="hk">status</span><span class="hv ok" id="bh-status">—</span></div>
      <div class="hr"><span class="hk">last seq</span><span class="hv" id="bh-seq">—</span></div>
      <div class="hr"><span class="hk">events</span><span class="hv" id="bh-ev">—</span></div>
      <div class="hr"><span class="hk">missions</span><span class="hv" id="bh-ms">—</span></div>
      <div class="hr"><span class="hk">decisions</span><span class="hv" id="bh-dc">—</span></div>
      <div class="hr"><span class="hk">polled</span><span class="hv" id="bh-time">—</span></div>
    </div>
  </div>

  <div class="main">
    <div class="tabs">
      <div class="tab active" onclick="tab('chat')">Chat <span class="tbadge" id="ubadge" style="display:none">0</span></div>
      <div class="tab" onclick="tab('missions')">Missions</div>
      <div class="tab" onclick="tab('agents')">Agents</div>
    </div>

    <div class="pane active" id="pane-chat" style="flex-direction:column">
      <div class="chat" id="chatlist"></div>
      <div class="composer">
        <div class="modes">
          <button class="mdbtn active" onclick="md('chat')" id="md-chat">Chat</button>
          <button class="mdbtn" onclick="md('mission')" id="md-mission">Mission</button>
          <button class="mdbtn" onclick="md('task')" id="md-task">Task</button>
        </div>
        <div class="crow">
          <textarea class="cinput" id="cin" rows="2" placeholder="Message the room…"></textarea>
          <button class="sbtn" id="sbtn" onclick="send()">Send</button>
        </div>
        <div class="chint" id="chint">Posting as arcides · Enter to send</div>
      </div>
    </div>

    <div class="pane" id="pane-missions"><div style="padding:12px;overflow-y:auto;flex:1" id="mslist"><div class="empty">No missions</div></div></div>
    <div class="pane" id="pane-agents"><div style="padding:12px;overflow-y:auto;flex:1" id="aglist"><div class="empty">No agents</div></div></div>
  </div>

  <div class="right">
    <div class="rl">Decisions</div>
    <div id="dlist"><div class="empty">None pending</div></div>
  </div>
</div>

<script>
// Arcides only — no identity switching in the console
const KEY = 'Bearer ak-sphera';
let BASE='', cursor=0, mode='chat', timer=null;
let seenSeqs=new Set(), unread=0;
let lastSeen={claude:0,soba:0,arcides:0};

const fmt=ts=>{try{return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch{return''}};
const p=ev=>(['claude','soba','arcides'].includes(ev.principal)?ev.principal:'system');
const ini=s=>(s||'?')[0].toUpperCase();

function setConn(live){
  document.getElementById('dot').className='dot '+(live?'live':'dead');
  document.getElementById('hurl').textContent=live?BASE:'not connected';
}

async function api(method,path,body){
  const r=await fetch(BASE+path,{method,headers:{'Authorization':KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  return r.json();
}

async function connect(){
  BASE=document.getElementById('srv').value.replace(/\/$/,'');
  setConn(false);
  try{
    const r=await api('GET','/health');
    if(r.ok){setConn(true);cursor=0;unread=0;seenSeqs.clear();document.getElementById('chatlist').innerHTML='';startPoll();}
    else document.getElementById('hurl').textContent='auth failed';
  }catch(e){document.getElementById('hurl').textContent='unreachable';}
}

function startPoll(){if(timer)clearInterval(timer);poll();timer=setInterval(poll,4000);}

async function poll(){
  try{
    // Events
    const ev=await api('GET',`/events?after=${cursor}`);
    if(ev.events?.length){ev.events.forEach(renderEvent);cursor=ev.cursor;}
    // Room state
    const rm=await api('GET','/room');
    if(rm.last_seq!==undefined){
      document.getElementById('bh-status').textContent='live';
      document.getElementById('bh-status').className='hv ok';
      document.getElementById('bh-seq').textContent=rm.last_seq;
      document.getElementById('bh-ev').textContent=rm.event_count;
      document.getElementById('bh-ms').textContent=rm.active_missions;
      document.getElementById('bh-dc').textContent=rm.pending_decisions;
      document.getElementById('bh-time').textContent=fmt(new Date().toISOString());
    }
    // Decisions
    const dc=await api('GET','/decisions');
    renderDecisions((dc.decisions||[]).filter(d=>d.status==='pending'));
    // Missions
    const ms=await api('GET','/missions');
    renderMissions(ms.missions||[]);
    // Agents
    const ag=await api('GET','/agents');
    renderAgents(ag.agents||[]);
  }catch(e){setConn(false);document.getElementById('bh-status').textContent='unreachable';document.getElementById('bh-status').className='hv err';}
}

function freshness(principal,seq){
  const prev=lastSeen[principal]||0;
  if(seq>prev){lastSeen[principal]=seq;}
  // Show freshness based on how recently they posted relative to total events
  const behind=cursor-lastSeen[principal];
  if(behind<5) return 'recent';
  if(behind<20) return 'stale';
  return 'offline';
}

function renderEvent(ev){
  if(seenSeqs.has(ev.seq))return;
  seenSeqs.add(ev.seq);
  const pr=p(ev);
  const content=ev.content||ev.objective||ev.description||ev.scope||'';
  const isMsg=['message','bridge_message'].includes(ev.type);
  const isSys=!isMsg;

  // Update principal freshness
  if(['claude','soba','arcides'].includes(pr)){
    document.getElementById(`pseq-${pr}`).textContent=`seq:${ev.seq}`;
    const f=freshness(pr,ev.seq);
    document.getElementById(`pfresh-${pr}`).className=`p-fresh ${f}`;
  }

  if(!content) return;
  if(isSys) return; // system events hidden — room stays clean

  const cl=document.getElementById('chatlist');
  const d=document.createElement('div');
  d.className='msg';
  const tr=ev.transport_provenance?`<span class="mtr">${ev.transport_provenance}</span>`:'';
  d.innerHTML=`<div class="av ${pr}">${ini(pr)}</div><div class="mb"><div class="mh"><span class="mn ${pr}">${pr}</span><span class="mt">${fmt(ev.ts)}</span>${tr}</div><div class="mc">${String(content).replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div><div class="ms">seq:${ev.seq}</div></div>`;
  cl.appendChild(d);
  cl.scrollTop=cl.scrollHeight;

  if(!document.getElementById('pane-chat').classList.contains('active')){
    unread++;const b=document.getElementById('ubadge');b.style.display='inline';b.textContent=unread;
  }
}

function renderDecisions(pending){
  const el=document.getElementById('dlist');
  if(!pending.length){el.innerHTML='<div class="empty">None pending</div>';return;}
  el.innerHTML=pending.map(d=>`<div class="dcard"><div class="dscope">${d.scope}</div><div class="dmeta">by ${d.requesting_principal}</div><button class="appbtn" onclick="approve('${d.request_id}')">✓ Approve</button></div>`).join('');
}

function renderMissions(missions){
  const el=document.getElementById('mslist');
  if(!missions.length){el.innerHTML='<div class="empty">No missions</div>';return;}
  el.innerHTML=missions.map(m=>{
    const pct=m.total?Math.round(m.done_count/m.total*100):0;
    return `<div class="mcard"><div class="mobj">${m.objective}</div><div class="mmeta"><span>${m.owner}</span><span>${m.done_count||0}/${m.work_count||0}</span><span>${m.status}</span></div><div class="pb"><div class="pf" style="width:${pct}%"></div></div></div>`;
  }).join('');
}

function renderAgents(agents){
  const el=document.getElementById('aglist');
  if(!agents.length){el.innerHTML='<div class="empty">No agents</div>';return;}
  el.innerHTML=agents.map(a=>{
    const caps=Array.isArray(a.capabilities)?a.capabilities.join(', '):a.capabilities;
    return `<div class="mcard"><div class="mobj">${a.name}</div><div class="mmeta"><span>${caps}</span><span class="${a.status==='available'?'hv ok':'hv err'}">${a.status}</span></div></div>`;
  }).join('');
}

async function send(){
  const inp=document.getElementById('cin');
  const content=inp.value.trim();
  if(!content||!BASE)return;
  const btn=document.getElementById('sbtn');
  btn.disabled=true;
  if(mode==='chat') await api('POST','/message',{content});
  else if(mode==='mission'){
    const r=await api('POST','/mission',{objective:content});
    if(r.mission_id) await api('POST',`/mission/${r.mission_id}/decompose`);
  }
  inp.value='';
  setTimeout(()=>{btn.disabled=false;},500);
  poll();
}

async function approve(rid){
  const note=prompt('Note (optional):')||'';
  await api('POST',`/decision/${rid}/approve`,{note});
  poll();
}

function md(m){
  mode=m;
  ['chat','mission','task'].forEach(x=>document.getElementById(`md-${x}`).className='mdbtn'+(x===m?' active':''));
  document.getElementById('chint').textContent={chat:'Posting as arcides · Enter to send',mission:'Create a mission · Enter to submit',task:'Describe task · select mission first'}[m];
  document.getElementById('cin').placeholder={chat:'Message the room…',mission:'Mission objective…',task:'Task description…'}[m];
}

function tab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['chat','missions','agents'][i]===name));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById(`pane-${name}`).classList.add('active');
  if(name==='chat'){unread=0;document.getElementById('ubadge').style.display='none';}
}

document.getElementById('cin').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
window.addEventListener('load',()=>{document.getElementById('srv').value='http://localhost:8765';});
</script>
</body>
</html>
